<div class="meucomputador">
  <div class="meucomputador-menu" aria-hidden="true">
    <span>Arquivo</span>
    <span>Editar</span>
    <span>Exibir</span>
    <span>Ajuda</span>
  </div>

  <div class="meucomputador-endereco">Endereço: Meu Computador</div>

  <ul class="meucomputador-itens">
    <li>
      <div class="meucomputador-item">
        <img src="imagens/icons-desktop/meu_computador.png" alt="" />
        <span class="meucomputador-texto">
          <strong>Disco local (C:)</strong>
          <small>1,72 GB de espaço livre</small>
        </span>
      </div>
    </li>

    <li>
      <button
        class="meucomputador-item"
        type="button"
        data-programa="calculadora"
      >
        <img src="imagens/icons-desktop/calculadora.svg" alt="" />
        <span class="meucomputador-texto">
          <strong>Calculadora</strong>
          <small>Aplicativo</small>
        </span>
      </button>
    </li>

    <li>
      <button
        class="meucomputador-item"
        type="button"
        data-programa="navegador"
      >
        <img src="imagens/icons-desktop/navegador.png" alt="" />
        <span class="meucomputador-texto">
          <strong>Navegador</strong>
          <small>Aplicativo</small>
        </span>
      </button>
    </li>

    <li>
      <button
        class="meucomputador-item"
        type="button"
        data-programa="bloco-de-notas"
      >
        <img src="imagens/icons-desktop/notepad.png" alt="" />
        <span class="meucomputador-texto">
          <strong>Bloco de Notas</strong>
          <small>Aplicativo</small>
        </span>
      </button>
    </li>

    <li>
      <div class="meucomputador-item">
        <img src="imagens/icons-desktop/controle.png" alt="" />
        <span class="meucomputador-texto">
          <strong>Painel de Controle</strong>
          <small>Configurações</small>
        </span>
      </div>
    </li>

    <li>
      <div class="meucomputador-item">
        <img src="imagens/icons-desktop/lixeira.png" alt="" />
        <span class="meucomputador-texto">
          <strong>Lixeira</strong>
          <small>Vazia</small>
        </span>
      </div>
    </li>
  </ul>

  <div class="meucomputador-status">6 objeto(s)</div>
</div>
