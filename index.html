<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeffersom.net</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="Programas/meucomputador/meucomputador.css" />
    <link rel="stylesheet" href="Programas/navegador/navegador.css" />
    <link rel="stylesheet" href="Programas/calculadora/calculadora.css" />
    <link rel="stylesheet" href="componentes/som-inicializacao.css" />
    <link rel="icon" href="imagens/favicon.png" type="image/png" />
  </head>
  <body>
    <div id="desktop">
      <button class="icon-meucomputer">
        <img
          src="imagens/icons-desktop/meu_computador.png"
          alt="Meu Computador"
        />
        <span>Meu computador</span>
      </button>

      <button class="icon-navegador">
        <img src="imagens/icons-desktop/navegador.png" alt="Navegador" />
        <span>Navegador</span>
      </button>

      <button class="icon-calculadora">
        <img src="imagens/icons-desktop/calculadora.svg" alt="Calculadora" />
        <span>Calculadora</span>
      </button>

      <!-- Menu Iniciar -->
      <div id="menu-iniciar">
        <div id="nome-iniciar">Jeffersom.net</div>

        <div id="itens-menu">
          <button class="item-menu-1">📁 teste</button>

          <button class="item-menu-2">👤 teste</button>

          <button class="item-menu-3">💻 teste</button>

          <button class="item-menu-4">📄 teste</button>

          <button class="item-menu-5">📧 teste</button>
        </div>
      </div>
      <!-- fim do menu iniciar -->

      <!-- Barra de tarefas -->
      <div id="barra-tarefa">
        <button id="iniciar-botao">
          <img src="imagens/windows_iniciar.png" alt="Windows" />
          <span>Iniciar</span>
        </button>

        <div id="programas-abertos"></div>

        <button id="botao-som-inicializacao" type="button" aria-label="Reproduzir som de inicialização" title="Reproduzir som de inicialização">🔊</button>
        <div id="relogio"></div>
      </div>
      <!-- fim da Barra de tarefas -->
    </div>

    <script src="script.js"></script>
    <script src="componentes/janela.js"></script>
    <script src="Programas/meucomputador/meucomputador.js"></script>
    <script src="Programas/navegador/navegador.js"></script>
    <script src="Programas/calculadora/calculadora.js"></script>
    <script src="componentes/som-inicializacao.js"></script>
  </body>
</html>
